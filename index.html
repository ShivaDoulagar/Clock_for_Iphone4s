<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StandBy Clock</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Rounded:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Nunito', sans-serif;
    cursor: default;
    user-select: none;
  }

  /* ── SLIDE CONTAINER ── */
  .slider {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 200%;
    transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
  }
  .slider.at-bottom { transform: translateY(-50%); }

  /* ── SHARED SCREEN ── */
  .screen {
    width: 100%;
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* ─────────────────────────────────────────
     THEME 1 — Digital / Gradient (Image 1)
  ───────────────────────────────────────── */
  .theme-digital {
    background: #0a0a0a;
  }

  .digital-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .digital-time {
    font-size: clamp(96px, 22vw, 200px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -4px;
    background: linear-gradient(135deg, #ff2d9f 0%, #bf5af2 45%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(191,90,242,0.4));
    animation: pulse-glow 3s ease-in-out infinite alternate;
  }

  @keyframes pulse-glow {
    from { filter: drop-shadow(0 0 30px rgba(255,45,159,0.35)); }
    to   { filter: drop-shadow(0 0 60px rgba(191,90,242,0.6)); }
  }

  .digital-date {
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 700;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* colon dot animation */
  .colon {
    display: inline-block;
    animation: blink 1s step-start infinite;
    margin: 0 2px;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  /* ─────────────────────────────────────────
     THEME 2 — Analog + Calendar (Image 2)
  ───────────────────────────────────────── */
  .theme-analog {
    background: #000;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: clamp(16px, 3vw, 40px);
    gap: clamp(16px, 3vw, 40px);
  }

  /* ── CLOCK FACE ── */
  .clock-face {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg.analog-svg {
    width: min(42vw, 42vh, 380px);
    height: min(42vw, 42vh, 380px);
    overflow: visible;
  }

  .tick-major { stroke: rgba(255,255,255,0.55); stroke-width: 3; stroke-linecap: round; }
  .tick-minor { stroke: rgba(255,255,255,0.22); stroke-width: 1.5; stroke-linecap: round; }
  .hour-num   { fill: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 22px; text-anchor: middle; dominant-baseline: central; }

  .hand-hour   { stroke: #fff; stroke-width: 9;  stroke-linecap: round; }
  .hand-minute { stroke: #fff; stroke-width: 6;  stroke-linecap: round; }
  .hand-second { stroke: #ff9f0a; stroke-width: 3; stroke-linecap: round; }
  .center-dot  { fill: #ff9f0a; }
  .center-dot-inner { fill: #1c1c1e; }

  /* ── CALENDAR ── */
  .calendar-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }

  .cal-month {
    font-size: clamp(18px, 3vw, 30px);
    font-weight: 800;
    color: #ff3b30;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(4px, 1vw, 10px) clamp(2px, 0.5vw, 6px);
    text-align: center;
  }

  .cal-hdr {
    font-size: clamp(10px, 1.8vw, 16px);
    font-weight: 800;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
  }

  .cal-day {
    font-size: clamp(11px, 2vw, 18px);
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    width: clamp(22px, 3.5vw, 36px);
    height: clamp(22px, 3.5vw, 36px);
    line-height: clamp(22px, 3.5vw, 36px);
    border-radius: 50%;
    margin: 0 auto;
    transition: color 0.3s;
  }

  .cal-day.today {
    background: #ff3b30;
    color: #fff;
  }

  /* ── SWIPE HINT ── */
  .swipe-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    opacity: 0.45;
    animation: bounce 2s ease-in-out infinite;
    pointer-events: none;
    z-index: 99;
  }
  .swipe-hint span {
    font-size: 11px;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .swipe-hint svg { fill: #fff; }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }

  /* theme indicator dots */
  .dots {
    position: fixed;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 99;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.4s, transform 0.4s;
  }
  .dot.active { background: #fff; transform: scale(1.4); }
</style>
</head>
<body>

<div class="slider" id="slider">

  <!-- THEME 1: Digital -->
  <div class="screen theme-digital">
    <div class="digital-wrap">
      <div class="digital-time" id="digitalTime">
        <span id="dHour">9</span><span class="colon">:</span><span id="dMin">41</span>
      </div>
      <div class="digital-date" id="digitalDate">Monday, April 6</div>
    </div>
  </div>

  <!-- THEME 2: Analog + Calendar -->
  <div class="screen theme-analog">

    <!-- Analog Clock -->
    <div class="clock-face">
      <svg class="analog-svg" viewBox="0 0 200 200" id="analogSvg">
        <!-- tick marks -->
        <g id="ticks"></g>
        <!-- hour numbers -->
        <g id="nums"></g>
        <!-- hands -->
        <line id="hourHand"   class="hand-hour"   x1="100" y1="100" x2="100" y2="55"/>
        <line id="minuteHand" class="hand-minute" x1="100" y1="100" x2="100" y2="38"/>
        <line id="secondHand" class="hand-second" x1="100" y1="115" x2="100" y2="35"/>
        <!-- center -->
        <circle class="center-dot"       cx="100" cy="100" r="6"/>
        <circle class="center-dot-inner" cx="100" cy="100" r="3"/>
      </svg>
    </div>

    <!-- Calendar -->
    <div class="calendar-wrap">
      <div class="cal-month" id="calMonth">June</div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

  </div>
</div>

<!-- Swipe hint -->
<div class="swipe-hint" id="swipeHint">
  <svg width="16" height="10" viewBox="0 0 16 10"><path d="M8 10L0 0h16z"/></svg>
  <span>Swipe</span>
</div>

<!-- Theme dots -->
<div class="dots">
  <div class="dot active" id="dot0"></div>
  <div class="dot"        id="dot1"></div>
</div>

<script>
/* ── BUILD ANALOG TICKS & NUMBERS ── */
(function buildFace() {
  const ticks = document.getElementById('ticks');
  const nums  = document.getElementById('nums');
  const cx = 100, cy = 100, r = 90;

  for (let i = 0; i < 60; i++) {
    const angle = (i * 6 - 90) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const outer = r, inner = isMajor ? r - 12 : r - 6;
    const x1 = cx + Math.cos(angle) * inner;
    const y1 = cy + Math.sin(angle) * inner;
    const x2 = cx + Math.cos(angle) * outer;
    const y2 = cy + Math.sin(angle) * outer;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', isMajor ? 'tick-major' : 'tick-minor');
    ticks.appendChild(line);
  }

  for (let n = 1; n <= 12; n++) {
    const angle = (n * 30 - 90) * Math.PI / 180;
    const nr = r - 26;
    const x = cx + Math.cos(angle) * nr;
    const y = cy + Math.sin(angle) * nr;
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', x); text.setAttribute('y', y);
    text.setAttribute('class','hour-num');
    text.textContent = n;
    nums.appendChild(text);
  }
})();

/* ── CLOCK UPDATER ── */
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

  // Digital
  document.getElementById('dHour').textContent = h % 12 || 12;
  document.getElementById('dMin').textContent  = String(m).padStart(2,'0');
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('digitalDate').textContent =
    `${dayNames[now.getDay()]}, ${monNames[now.getMonth()]} ${now.getDate()}`;

  // Analog hands
  const secDeg  = s * 6;
  const minDeg  = m * 6 + s * 0.1;
  const hourDeg = (h % 12) * 30 + m * 0.5;

  setHand('hourHand',   hourDeg, 42);
  setHand('minuteHand', minDeg,  32);
  setHand('secondHand', secDeg,  32);
}

function setHand(id, deg, len) {
  const rad = (deg - 90) * Math.PI / 180;
  const ex = 100 + Math.cos(rad) * len;
  const ey = 100 + Math.sin(rad) * len;
  // tail (second hand has tail)
  let sx = 100, sy = 100;
  if (id === 'secondHand') {
    const tail = 15;
    sx = 100 - Math.cos(rad) * tail;
    sy = 100 - Math.sin(rad) * tail;
  }
  const el = document.getElementById(id);
  el.setAttribute('x1', sx); el.setAttribute('y1', sy);
  el.setAttribute('x2', ex); el.setAttribute('y2', ey);
}

/* ── CALENDAR BUILDER ── */
function buildCalendar() {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();

  const monNames = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
  document.getElementById('calMonth').textContent = monNames[month];

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Headers
  ['S','M','T','W','T','F','S'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-hdr'; el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay  = new Date(year, month, 1).getDay();
  const daysInMon = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div'); el.className = 'cal-day';
    grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMon; d++) {
    const el = document.createElement('div');
    el.className = 'cal-day' + (d === today ? ' today' : '');
    el.textContent = d;
    grid.appendChild(el);
  }
}

buildCalendar();
updateClock();
setInterval(updateClock, 1000);

/* ── SWIPE / SCROLL HANDLING ── */
let currentTheme = 0;
const slider = document.getElementById('slider');

function goTo(index) {
  currentTheme = index;
  slider.classList.toggle('at-bottom', index === 1);
  document.getElementById('dot0').classList.toggle('active', index === 0);
  document.getElementById('dot1').classList.toggle('active', index === 1);
  // hide hint after first swipe
  document.getElementById('swipeHint').style.opacity = '0';
}

// Touch
let touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend',   e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) < 30) return;
  goTo(dy > 0 ? 1 : 0);
}, {passive:true});

// Mouse wheel
let wheelLock = false;
document.addEventListener('wheel', e => {
  if (wheelLock) return;
  wheelLock = true;
  goTo(e.deltaY > 0 ? 1 : 0);
  setTimeout(() => wheelLock = false, 700);
}, {passive:true});

// Keyboard arrow keys
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') goTo(1);
  if (e.key === 'ArrowUp')   goTo(0);
});
</script>
</body>
</html>
