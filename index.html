<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StandBy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: none;
    }

    /* ─── HORIZONTAL SLIDER ─── */
    .slider {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      width: 960px;
      height: 320px;
      -webkit-transition: -webkit-transform 0.52s cubic-bezier(0.77, 0, 0.175, 1);
      transition: -webkit-transform 0.52s cubic-bezier(0.77, 0, 0.175, 1);
      -webkit-transform: translateX(0);
      transform: translateX(0);
      will-change: transform;
    }

    .slider.right {
      -webkit-transform: translateX(-480px);
      transform: translateX(-480px);
    }

    .screen {
      width: 480px;
      height: 320px;
      position: relative;
      overflow: hidden;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    /* ════════════════════════════
   THEME 1 — DIGITAL
════════════════════════════ */
    .t1 {
      background: #000;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 0 28px;
      gap: 22px;
    }

    .t1::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: -webkit-radial-gradient(center, ellipse, rgba(255, 140, 0, 0.07) 0%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
    }

    .t1-left {
      position: relative;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }

    .t1-ampm {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 160, 0, 0.55);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .t1-time {
      font-size: 118px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -6px;
      color: #fff;
      text-shadow: 0 0 28px rgba(255, 155, 0, 0.5), 0 0 8px rgba(255, 200, 80, 0.25);
    }

    .colon {
      display: inline-block;
      -webkit-animation: blink 1s step-start infinite;
      animation: blink 1s step-start infinite;
    }

    @-webkit-keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    .t1-divider {
      position: relative;
      width: 1px;
      height: 160px;
      background: rgba(255, 255, 255, 0.08);
    }

    .t1-right {
      position: relative;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 4px;
    }

    .t1-dayname {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .t1-datenum {
      font-size: 56px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      letter-spacing: -2px;
    }

    .t1-monthyr {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .t1-secs-label {
      font-size: 8px;
      font-weight: 700;
      color: rgba(255, 160, 0, 0.38);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .t1-secs {
      font-size: 28px;
      font-weight: 700;
      color: rgba(255, 155, 0, 0.5);
      letter-spacing: 1px;
      line-height: 1;
    }

    /* ════════════════════════════
   THEME 2 — ANALOG + CALENDAR
════════════════════════════ */
    .t2 {
      background: #0c0c0e;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
    }

    .clock-wrap {
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .analog-svg {
      width: 290px;
      height: 290px;
      display: block;
      overflow: visible;
    }

    .ring {
      fill: none;
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 2;
    }

    .tick-maj {
      stroke: rgba(255, 255, 255, 0.65);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .tick-min {
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .h-num {
      fill: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      font-weight: 700;
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .hand-h {
      stroke: #fff;
      stroke-width: 7;
      stroke-linecap: round;
    }

    .hand-m {
      stroke: #fff;
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .hand-s {
      stroke: #ff9500;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .cdot {
      fill: #ff9500;
    }

    .cdot-i {
      fill: #0c0c0e;
    }

    .cal-panel {
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      gap: 5px;
    }

    .cal-mon {
      font-size: 10px;
      font-weight: 700;
      color: #ff3b30;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .cal-row {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .cal-hdr,
    .cal-day {
      width: 15px;
      text-align: center;
      font-size: 8px;
      font-weight: 700;
    }

    .cal-hdr {
      color: rgba(255, 255, 255, 0.28);
    }

    .cal-day {
      color: rgba(255, 255, 255, 0.5);
      line-height: 15px;
    }

    .cal-day.today {
      background: #ff3b30;
      color: #fff;
      border-radius: 50%;
      width: 17px;
      height: 17px;
      line-height: 17px;
      margin: -1px;
      text-align: center;
    }

    .cal-day.empty {
      color: transparent;
    }

    /* ─── DOTS ─── */
    .dots {
      position: fixed;
      bottom: 8px;
      left: 50%;
      margin-left: -14px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: horizontal;
      -webkit-flex-direction: row;
      flex-direction: row;
      gap: 6px;
      z-index: 50;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      -webkit-transition: background 0.3s, -webkit-transform 0.3s;
      transition: background 0.3s, transform 0.3s;
    }

    .dot.on {
      background: #fff;
      -webkit-transform: scale(1.4);
      transform: scale(1.4);
    }

    /* ─── HINT — points right ─── */
    .hint {
      position: fixed;
      right: 10px;
      top: 50%;
      margin-top: -18px;
      z-index: 50;
      text-align: center;
      -webkit-animation: bob 2s ease-in-out infinite;
      animation: bob 2s ease-in-out infinite;
      -webkit-transition: opacity 0.5s;
      transition: opacity 0.5s;
    }

    .hint span {
      display: block;
      font-size: 7px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .hint-arrow {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid rgba(255, 255, 255, 0.3);
      margin: 0 auto;
    }

    @-webkit-keyframes bob {

      0%,
      100% {
        -webkit-transform: translateX(0)
      }

      50% {
        -webkit-transform: translateX(4px)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateX(0)
      }

      50% {
        transform: translateX(4px)
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="slider" id="slider">

    <!-- THEME 1: Digital -->
    <div class="screen t1">
      <div class="t1-left">
        <div class="t1-ampm" id="ampm">AM</div>
        <div class="t1-time">
          <span id="dH">9</span><span class="colon">:</span><span id="dM">41</span>
        </div>
      </div>
      <div class="t1-divider"></div>
      <div class="t1-right">
        <div class="t1-dayname" id="dDay">Monday</div>
        <div class="t1-datenum" id="dNum">6</div>
        <div class="t1-monthyr" id="dMonYr">April 2026</div>
        <div class="t1-secs-label">SEC</div>
        <div class="t1-secs" id="dS">00</div>
      </div>
    </div>

    <!-- THEME 2: Analog + Calendar -->
    <div class="screen t2 ">
      <div class="clock-wrap ">
        <div class="clock">
          <svg class="analog-svg" viewBox="0 0 200 200">
            <circle class="ring" cx="100" cy="100" r="96" />
            <g id="ticks"></g>
            <g id="hnums"></g>
            <line id="hH" class="hand-h" x1="100" y1="100" x2="100" y2="58" />
            <line id="hM" class="hand-m" x1="100" y1="100" x2="100" y2="38" />
            <line id="hS" class="hand-s" x1="100" y1="118" x2="100" y2="34" />
            <circle class="cdot" cx="100" cy="100" r="5.5" />
            <circle class="cdot-i" cx="100" cy="100" r="2.5" />
          </svg>
        </div>
      </div>
      <div class="cal-panel">
        <div class="cal-mon" id="calMon">April</div>
        <div id="calGrid"></div>
      </div>
    </div>
  </div>

  <div class="dots">
    <div class="dot on" id="d0"></div>
    <div class="dot" id="d1"></div>
  </div>

  <div class="hint" id="hint">
    <div class="hint-arrow"></div>
    <span>Swipe</span>
  </div>

  <script>
    /* ─── ANALOG FACE ─── */
    (function () {
      var tg = document.getElementById('ticks'), ng = document.getElementById('hnums');
      var cx = 100, cy = 100, r = 88;
      for (var i = 0; i < 60; i++) {
        var maj = (i % 5 === 0), ang = (i * 6 - 90) * Math.PI / 180;
        var inner = maj ? r - 11 : r - 5;
        var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        ln.setAttribute('x1', cx + Math.cos(ang) * inner); ln.setAttribute('y1', cy + Math.sin(ang) * inner);
        ln.setAttribute('x2', cx + Math.cos(ang) * r); ln.setAttribute('y2', cy + Math.sin(ang) * r);
        ln.setAttribute('class', maj ? 'tick-maj' : 'tick-min');
        tg.appendChild(ln);
      }
      for (var n = 1; n <= 12; n++) {
        var a = (n * 30 - 90) * Math.PI / 180, nr = r - 22;
        var tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tx.setAttribute('x', cx + Math.cos(a) * nr); tx.setAttribute('y', cy + Math.sin(a) * nr);
        tx.setAttribute('class', 'h-num'); tx.textContent = n;
        ng.appendChild(tx);
      }
    })();

    /* ─── CALENDAR ─── */
    (function () {
      var now = new Date(), yr = now.getFullYear(), mo = now.getMonth(), tod = now.getDate();
      var SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      document.getElementById('calMon').textContent = SHORT[mo];
      var first = new Date(yr, mo, 1).getDay(), total = new Date(yr, mo + 1, 0).getDate();
      var grid = document.getElementById('calGrid'), hdrs = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      var hr = document.createElement('div'); hr.className = 'cal-row';
      for (var h = 0; h < 7; h++) { var hc = document.createElement('div'); hc.className = 'cal-hdr'; hc.textContent = hdrs[h]; hr.appendChild(hc); }
      grid.appendChild(hr);
      var cells = [];
      for (var i = 0; i < first; i++) cells.push(0);
      for (var d = 1; d <= total; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(0);
      for (var row = 0; row < cells.length; row += 7) {
        var rw = document.createElement('div'); rw.className = 'cal-row';
        for (var col = 0; col < 7; col++) {
          var v = cells[row + col], el = document.createElement('div');
          if (v === 0) { el.className = 'cal-day empty'; el.textContent = '-'; }
          else { el.className = 'cal-day' + (v === tod ? ' today' : ''); el.textContent = v; }
          rw.appendChild(el);
        }
        grid.appendChild(rw);
      }
    })();

    /* ─── CLOCK ─── */
    var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var MONS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function setHand(id, deg, len, tail) {
      var rad = (deg - 90) * Math.PI / 180;
      var ex = 100 + Math.cos(rad) * len, ey = 100 + Math.sin(rad) * len;
      var sx = tail ? 100 - Math.cos(rad) * tail : 100, sy = tail ? 100 - Math.sin(rad) * tail : 100;
      var el = document.getElementById(id);
      el.setAttribute('x1', sx); el.setAttribute('y1', sy);
      el.setAttribute('x2', ex); el.setAttribute('y2', ey);
    }

    function tick() {
      var now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      var h12 = h % 12 || 12;
      document.getElementById('ampm').textContent = h < 12 ? 'AM' : 'PM';
      document.getElementById('dH').textContent = h12;
      document.getElementById('dM').textContent = pad(m);
      document.getElementById('dS').textContent = pad(s);
      document.getElementById('dDay').textContent = DAYS[now.getDay()];
      document.getElementById('dNum').textContent = now.getDate();
      document.getElementById('dMonYr').textContent = MONS[now.getMonth()] + ' ' + now.getFullYear();
      setHand('hH', h12 * 30 + m * 0.5, 42, 0);
      setHand('hM', m * 6 + s * 0.1, 34, 0);
      setHand('hS', s * 6, 32, 14);
    }
    tick();
    setInterval(tick, 1000);

    /* ─── HORIZONTAL SWIPE ─── */
    var cur = 0, slider = document.getElementById('slider'), hint = document.getElementById('hint');
    var tsX = 0, tsY = 0, swiping = false;

    function goTo(idx) {
      cur = idx;
      slider.className = idx === 1 ? 'slider right' : 'slider';
      document.getElementById('d0').className = idx === 0 ? 'dot on' : 'dot';
      document.getElementById('d1').className = idx === 1 ? 'dot on' : 'dot';
      hint.style.opacity = '0';
    }

    document.addEventListener('touchstart', function (e) {
      tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; swiping = false;
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      var dx = tsX - e.touches[0].clientX, dy = tsY - e.touches[0].clientY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
        swiping = true;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchend', function (e) {
      if (!swiping) return;
      var dx = tsX - e.changedTouches[0].clientX;
      if (Math.abs(dx) < 25) return;
      goTo(dx > 0 ? 1 : 0);
      swiping = false;
    }, { passive: true });

    /* desktop: scroll wheel or trackpad */
    var wLock = false;
    document.addEventListener('wheel', function (e) {
      if (wLock) return; wLock = true;
      goTo((e.deltaX > 0 || e.deltaY > 0) ? 1 : 0);
      setTimeout(function () { wLock = false; }, 650);
    }, false);

    /* arrow keys */
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 39) goTo(1);
      if (e.keyCode === 37) goTo(0);
    });
  </script>
</body>

</html>
